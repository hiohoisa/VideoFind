<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>蒸汽惊魂夜 V2</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="menu">
  <div class="menu-shell">
    <div class="title-block">
      <div class="eyebrow">STEAM HORROR NIGHT · V2</div>
      <h1>蒸汽惊魂夜</h1>
      <div class="subtitle">平板触屏版 · 程序绘制美术 · 建议横屏</div>
    </div>

    <div class="menu-grid">
      <section class="glass-card">
        <div class="section-title">对局设置</div>
        <div class="label">模式</div>
        <div class="seg-row">
          <button id="m14" class="seg active">1v4</button>
          <button id="m28" class="seg">2v8</button>
        </div>

        <div class="label">阵营</div>
        <div class="seg-row">
          <button id="ss" class="seg active">逃生者</button>
          <button id="sh" class="seg">追捕者 · 贝琳达</button>
        </div>

        <div class="label">逃生角色</div>
        <div class="character-grid" id="chars">
          <button data-c="miner" class="char-card active"><span class="char-icon" data-icon="shovel"></span><b>矿工</b><small>铁铲 / 能工巧匠</small></button>
          <button data-c="doctor" class="char-card"><span class="char-icon" data-icon="med"></span><b>医生</b><small>医疗包 / 血样采集</small></button>
          <button data-c="dancer" class="char-card"><span class="char-icon" data-icon="dash"></span><b>舞女</b><small>闪避 / 借力</small></button>
          <button data-c="soldier" class="char-card"><span class="char-icon" data-icon="smoke"></span><b>士兵</b><small>云雾弹 / 军事训练</small></button>
          <button data-c="tamer" class="char-card"><span class="char-icon" data-icon="roll"></span><b>驯兽师</b><small>翻滚 / 鞭笞</small></button>
        </div>

        <div id="status" class="status-chip">当前：1v4 / 逃生者 / 矿工</div>
      </section>

      <section class="glass-card">
        <div class="section-title">准备</div>
        <div class="currency-line">
          <span>煤矿</span>
          <b id="coalCount">120</b>
        </div>
        <button id="shopBtn" class="wide secondary">徽章商店</button>
        <button id="start" class="wide primary">开始游戏</button>
        <div class="tip">左下摇杆移动；技能需要长按时，按住后拖动选点/方向，松手释放。</div>
      </section>
    </div>
  </div>
</div>

<div id="shop" class="modal hidden">
  <div class="modal-panel">
    <div class="modal-head">
      <div>
        <div class="eyebrow">BADGE SHOP</div>
        <h2>徽章商店</h2>
      </div>
      <button id="shopClose" class="icon-btn">×</button>
    </div>
    <div class="shop-meta">
      <span>煤矿余额：<b id="shopCoal">120</b></span>
      <span>典藏最多装备 1 个 · 稀有最多装备 3 个</span>
    </div>
    <div class="shop-section">
      <h3>典藏</h3>
      <div id="legendaryGrid" class="badge-grid"></div>
    </div>
    <div class="shop-section">
      <h3>稀有</h3>
      <div id="rareGrid" class="badge-grid"></div>
    </div>
  </div>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="hudMain"></div>
  <div id="paintingAlert"></div>
</div>
<div id="toast"></div>
<button id="back">返回菜单</button>

<div id="calibration" class="hidden">
  <div class="calib-card">
    <div class="calib-title">蒸汽炉校准</div>
    <div class="calib-track">
      <div class="calib-zone white-left"></div>
      <div class="calib-zone red-zone"></div>
      <div class="calib-zone white-right"></div>
      <div id="needle"></div>
    </div>
    <div class="calib-foot">点击任意位置完成本次校准</div>
  </div>
</div>

<div id="controls">
  <div id="joy"><div id="knob"></div></div>

  <div class="action-btn" id="interact">
    <span class="skill-icon" data-icon="hand"></span>
    <span class="skill-label">交互</span>
  </div>

  <div class="action-btn" id="attack">
    <span class="skill-icon" data-icon="claw"></span>
    <span class="skill-label">攻击</span>
  </div>

  <div class="action-btn major" id="skill1">
    <span class="skill-icon" data-icon="sketch"></span>
    <span class="skill-label">技能1</span>
    <span class="skill-sub"></span>
    <span class="charge-pill"></span>
  </div>

  <div class="action-btn major" id="skill2">
    <span class="skill-icon" data-icon="portal"></span>
    <span class="skill-label">技能2</span>
    <span class="skill-sub"></span>
  </div>

  <div class="action-btn ultimate" id="ultimate">
    <span class="skill-icon" data-icon="gallery"></span>
    <span class="skill-label">终极技能</span>
    <span class="skill-sub"></span>
  </div>

  <div class="action-btn" id="carry">
    <span class="skill-icon" data-icon="carry"></span>
    <span class="skill-label">扛起</span>
  </div>
</div>

<div id="aimHint" class="hidden">
  <div id="aimTitle"></div>
  <div id="aimText"></div>
</div>

<script src="./game.js"></script>
</body>
</html>
