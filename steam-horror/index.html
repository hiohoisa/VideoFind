<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>蒸汽惊魂夜</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12151b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;touch-action:none}button{color:#fff;background:#2d3442;border:1px solid #687489;border-radius:12px;padding:10px 14px;font:inherit}.sel{background:#6a51a2!important;outline:2px solid #d7c8ff}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#10141d,#262039)}#panel{width:min(920px,94vw);max-height:94vh;overflow:auto;padding:18px;border-radius:22px;background:#171b27f5;border:1px solid #4e586d}.row{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.card{padding:12px;margin:8px 0;border-radius:14px;background:#222837;border:1px solid #3d4659}.small{opacity:.75;font-size:13px}#start{font-size:20px;background:#6650a0;padding:13px 24px}#game{display:none;width:100vw;height:100vh;background:#233027}#hud{position:fixed;left:12px;top:10px;z-index:7;text-shadow:0 2px 4px #000;font-size:14px;pointer-events:none}#toast{position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:9;background:#000b;padding:8px 14px;border-radius:12px;pointer-events:none}#controls{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}#joy{pointer-events:auto;position:absolute;left:22px;bottom:24px;width:126px;height:126px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff40}#knob{position:absolute;left:37px;top:37px;width:52px;height:52px;border-radius:50%;background:#ffffff55;border:2px solid #fff8}.act{pointer-events:auto;position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;background:#343c51e8;border:2px solid #ffffff55;user-select:none;font-size:13px}#interact{right:188px;bottom:28px;background:#41614b}#attack{right:24px;bottom:28px}#skill1{right:104px;bottom:85px}#skill2{right:24px;bottom:122px}#carry{right:188px;bottom:118px}@media(max-width:820px){.act{width:62px;height:62px}#interact,#carry{right:165px}}
</style>
</head>
<body>
<div id="menu"><div id="panel">
<h1 style="margin:0 0 4px">蒸汽惊魂夜</h1>
<div class="small">平板触屏版 · 建议横屏</div>
<div class="card"><b>模式</b><div class="row"><button id="m14" class="sel">1v4</button><button id="m28">2v8</button></div></div>
<div class="card"><b>阵营</b><div class="row"><button id="ss" class="sel">逃生者</button><button id="sh">追捕者 · 贝琳达</button></div></div>
<div class="card"><b>角色</b><div class="row" id="chars"><button class="sel" data-c="矿工">矿工</button><button data-c="医生">医生</button><button data-c="舞女">舞女</button><button data-c="士兵">士兵</button><button data-c="驯兽师">驯兽师</button></div></div>
<div class="card small" id="state">当前：1v4 / 逃生者 / 矿工</div>
<div class="row"><button id="start">开始游戏</button></div>
<div class="small">左下摇杆移动；右侧交互、攻击和技能。电脑也支持 WASD / E / J / K / L。</div>
</div></div>
<canvas id="game"></canvas><div id="hud"></div><div id="toast"></div>
<div id="controls"><div id="joy"><div id="knob"></div></div><div class="act" id="interact">交互</div><div class="act" id="attack">攻击</div><div class="act" id="skill1">技能1</div><div class="act" id="skill2">技能2</div><div class="act" id="carry">扛起</div></div>
<script>
(()=>{
"use strict";
const $=x=>document.getElementById(x),cv=$("game"),cx=cv.getContext("2d");
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);function rs(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(D,0,0,D,0,0)}addEventListener("resize",rs);rs();
let mode="1v4",side="s",char="矿工",running=false,last=performance.now(),toastT=0;
const WORLD={w:2600,h:1800},walls=[[270,180,500,70],[930,110,80,420],[1230,250,520,75],[1950,160,75,440],[220,620,75,530],[470,760,520,70],[1180,650,80,500],[1430,790,540,70],[2080,720,80,570],[360,1320,560,70],[1120,1370,600,70],[1920,1290,450,75],[650,1030,80,240],[1540,1050,80,210]],fpos=[[430,410],[820,370],[1380,510],[1820,430],[2320,460],[420,1040],[980,1160],[1410,1010],[1840,1120],[2320,1050]],lockers=[[620,330],[1110,520],[1740,330],[2290,760],[510,1210],[1460,1260],[2020,1180]],pops=[[250,300],[2350,300],[330,1520],[2250,1500]],gpos=[[1300,45],[1300,1755]];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function blocked(x,y,r=17){if(x-r<0||y-r<0||x+r>WORLD.w||y+r>WORLD.h)return true;return walls.some(q=>x+r>q[0]&&x-r<q[0]+q[2]&&y+r>q[1]&&y-r<q[1]+q[3])}
function mv(e,dx,dy){if(!blocked(e.x+dx,e.y,e.r))e.x+=dx;if(!blocked(e.x,e.y+dy,e.r))e.y+=dy}
function step(e,t,s,dt){let x=t.x-e.x,y=t.y-e.y,m=Math.hypot(x,y)||1;x/=m;y/=m;for(const v of [[x,y],[-y,x],[y,-x]])if(!blocked(e.x+v[0]*s*dt*2,e.y+v[1]*s*dt*2,e.r)){mv(e,v[0]*s*dt,v[1]*s*dt);break}}
let furn=[],gates=[],ents=[],player=null,needed=5,escaped=0;
function S(i,p=false){return{kind:"s",x:180+Math.random()*2200,y:180+Math.random()*1400,r:17,hp:mode==="1v4"?2:3,max:mode==="1v4"?2:3,char:p?char:["矿工","医生","舞女","士兵","驯兽师"][i%5],speed:165,down:false,dead:false,hook:null,hookT:0,hookN:0,hide:null,target:null,cd:0,dodge:0,boost:0,charges:3,coal:0}}
function Hn(i){return{kind:"h",x:i?2200:1300,y:i?1450:900,r:23,speed:178,dead:false,stun:0,atk:0,target:null,carry:null,energy:0,boost:0}}
function reset(){furn=fpos.map(([x,y])=>({x,y,p:0}));gates=gpos.map(([x,y])=>({x,y,o:0}));ents=[];escaped=0;needed=mode==="1v4"?5:7;let ns=mode==="1v4"?4:8,nh=mode==="1v4"?1:2;if(side==="s"){player=S(0,true);ents.push(player);for(let i=1;i<ns;i++)ents.push(S(i));for(let i=0;i<nh;i++)ents.push(Hn(i))}else{player=Hn(0);ents.push(player);for(let i=1;i<nh;i++)ents.push(Hn(i));for(let i=0;i<ns;i++)ents.push(S(i))}}
function say(t){$("toast").textContent=t;toastT=1.6}
function updState(){$("state").textContent="当前："+mode+" / "+(side==="s"?"逃生者":"追捕者")+" / "+char}
function sel(ids,on){ids.forEach(id=>$(id).classList.remove("sel"));$(on).classList.add("sel")}
$("m14").onclick=()=>{mode="1v4";sel(["m14","m28"],"m14");updState()};$("m28").onclick=()=>{mode="2v8";sel(["m14","m28"],"m28");updState()};$("ss").onclick=()=>{side="s";sel(["ss","sh"],"ss");updState()};$("sh").onclick=()=>{side="h";sel(["ss","sh"],"sh");updState()};
[...$("chars").querySelectorAll("button")].forEach(b=>b.onclick=()=>{char=b.dataset.c;[...$("chars").children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");updState()});
$("start").onclick=()=>{reset();running=true;$("menu").style.display="none";cv.style.display="block";$("controls").style.display="block";say("对局开始")};
let joy={x:0,y:0,id:null},jb=$("joy"),kn=$("knob");function joySet(e){let r=jb.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.hypot(x,y),R=r.width*.35;if(m>R){x*=R/m;y*=R/m}joy.x=x/R;joy.y=y/R;kn.style.transform="translate("+x+"px,"+y+"px)"}jb.onpointerdown=e=>{joy.id=e.pointerId;jb.setPointerCapture(e.pointerId);joySet(e)};jb.onpointermove=e=>{if(e.pointerId===joy.id)joySet(e)};jb.onpointerup=jb.onpointercancel=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;kn.style.transform="translate(0,0)"}};
const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==="e")interact();if(e.key.toLowerCase()==="j")attack();if(e.key.toLowerCase()==="k")skill1();if(e.key.toLowerCase()==="l")skill2()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
function nearest(e,a,max=1e9){let b=null,bd=max;for(const o of a){let dd=Math.hypot(e.x-(o.x??o[0]),e.y-(o.y??o[1]));if(dd<bd){bd=dd;b=o}}return b}
function damage(s){if(s.dodge>0){say("闪避成功");return}s.hp--;s.boost=1;if(s.hp<=0){s.hp=0;s.down=true}}
function interact(){if(!running||player.dead)return;if(player.kind==="s"){if(player.down)return;let l=nearest(player,lockers,55);if(l){player.hide=player.hide?null:l;if(player.hide){player.x=l[0];player.y=l[1];say("躲进柜子")}else say("离开柜子");return}let f=nearest(player,furn.filter(x=>x.p<100),85);if(f){player.target=f;say("开始挖蒸汽炉");return}let mate=nearest(player,ents.filter(e=>e.kind==="s"&&e!==player&&!e.dead),65);if(mate){if(mate.hook){mate.hook=null;mate.down=false;mate.hp=Math.max(1,mate.hp);say("救援成功")}else if(mate.hp<mate.max){mate.hp++;mate.down=false;say("治疗完成")}return}if(furn.filter(x=>x.p>=100).length>=needed){let g=nearest(player,gates,90);if(g){player.target={gate:g};say("开启逃生门")}}}else say("追捕者请使用攻击/扛起")}
function attack(){if(!running||player.kind!=="h"||player.atk>0)return;player.atk=.85;for(const l of lockers){if(Math.hypot(player.x-l[0],player.y-l[1])<65){let s=ents.find(e=>e.kind==="s"&&e.hide===l&&!e.dead);if(s){s.hide=null;damage(s);say("击中柜中逃生者");return}}}let s=nearest(player,ents.filter(e=>e.kind==="s"&&!e.dead&&!e.hide&&!e.hook),75);if(s){damage(s);say("命中逃生者")}}
function carry(){if(!running||player.kind!=="h")return;if(player.carry){let p=nearest(player,pops,90);if(p){let s=player.carry;s.hook=p;s.x=p[0];s.y=p[1];s.hookN++;player.carry=null;if(s.hookN>=3){s.dead=true;s.hook=null;say("第三次上挂：淘汰")}else say("挂上爆米花机")}return}let s=nearest(player,ents.filter(e=>e.kind==="s"&&e.down&&!e.dead&&!e.hook),65);if(s){player.carry=s;s.down=true;say("扛起逃生者")}}
function skill1(){if(!running)return;if(player.kind==="s"){if(player.char==="矿工"&&player.coal>=50){let f=nearest(player,furn.filter(x=>x.p<100),110);if(f){f.p=Math.min(100,f.p+30);player.coal-=50;say("铁铲 +30%")}}else if(player.char==="医生"&&player.hp<player.max){player.hp++;say("医疗包自疗")}else if(player.char==="舞女"&&player.charges>0){player.charges--;player.dodge=1;player.boost=1;say("闪避")}else if(player.char==="士兵"){player.boost=.5;say("云雾弹：短暂隐蔽")}else if(player.char==="驯兽师"&&player.cd<=0){player.boost=2;player.cd=28;say("翻滚")}}else{player.energy=Math.min(100,player.energy+25);say("速写：能量 +25")}}
function skill2(){if(!running||player.kind!=="h")return;if(player.energy>=100){player.energy=0;player.boost=20;say("画廊穿梭")}else say("能量不足")}
$("interact").onpointerdown=interact;$("attack").onpointerdown=attack;$("carry").onpointerdown=carry;$("skill1").onpointerdown=skill1;$("skill2").onpointerdown=skill2;
function aiH(h,dt){if(h.stun>0){h.stun-=dt;return}if(h.carry){let p=nearest(h,pops);step(h,{x:p[0],y:p[1]},h.speed,dt);if(Math.hypot(h.x-p[0],h.y-p[1])<55){let s=h.carry;s.hook=p;s.x=p[0];s.y=p[1];s.hookN++;h.carry=null;if(s.hookN>=3){s.dead=true;s.hook=null}}return}let s=nearest(h,ents.filter(e=>e.kind==="s"&&!e.dead&&!e.hide&&!e.hook),430);if(s){h.target=s;step(h,s,h.speed,dt);if(dist(h,s)<65&&h.atk<=0){h.atk=.95;damage(s)}if(s.down&&dist(h,s)<48){h.carry=s;h.target=null}}else{let f=furn.filter(x=>x.p<100).sort((a,b)=>b.p-a.p)[0];if(f)step(h,f,h.speed*.65,dt)}}
function aiS(s,dt){if(s.dead||s.hook)return;if(s.down){let h=nearest(s,ents.filter(e=>e.kind==="h"));if(h){let x=s.x-h.x,y=s.y-h.y,m=Math.hypot(x,y)||1;mv(s,x/m*s.speed*.5*dt,y/m*s.speed*.5*dt)}return}let h=nearest(s,ents.filter(e=>e.kind==="h"),260);if(h){let x=s.x-h.x,y=s.y-h.y,m=Math.hypot(x,y)||1;mv(s,x/m*s.speed*dt,y/m*s.speed*dt);return}let f=nearest(s,furn.filter(x=>x.p<100));if(f){step(s,f,s.speed*.85,dt);if(Math.hypot(s.x-f.x,s.y-f.y)<70)f.p=Math.min(100,f.p+.4*(s.char==="矿工"?1.5:1)*dt)}else{let g=nearest(s,gates);step(s,g,s.speed,dt);if(Math.hypot(s.x-g.x,s.y-g.y)<70){g.o=Math.min(10,g.o+dt);if(g.o>=10){s.dead=true;escaped++}}}}
function update(dt){if(!running)return;let x=(keys.d?1:0)-(keys.a?1:0)+joy.x,y=(keys.s?1:0)-(keys.w?1:0)+joy.y,m=Math.hypot(x,y);if(m>1){x/=m;y/=m}if(!player.dead&&!player.down&&!player.hook&&!player.hide){let sp=player.speed*(player.boost>0?1.3:1);mv(player,x*sp*dt,y*sp*dt)}for(const e of ents){if(e.atk>0)e.atk-=dt;if(e.cd>0)e.cd-=dt;if(e.dodge>0)e.dodge-=dt;if(e.boost>0)e.boost-=dt;if(e.kind==="h")e.energy=Math.min(100,e.energy+dt)}if(player.kind==="s"&&player.target){if(player.target.gate){let g=player.target.gate;if(Math.hypot(player.x-g.x,player.y-g.y)<90){g.o=Math.min(10,g.o+dt);if(g.o>=10&&!player.dead){player.dead=true;escaped++;say("成功逃生")}}else player.target=null}else{let f=player.target;if(Math.hypot(player.x-f.x,player.y-f.y)<85&&f.p<100){f.p=Math.min(100,f.p+.4*(player.char==="矿工"?1.5:1)*dt);player.coal+=dt}else player.target=null}}for(const s of ents.filter(e=>e.kind==="s"&&!e.dead&&e.hook)){s.hookT+=dt;if(s.hookT>=20){s.dead=true;s.hook=null}}for(const e of ents){if(e===player||e.dead)continue;e.kind==="h"?aiH(e,dt):aiS(e,dt)}if(toastT>0){toastT-=dt;if(toastT<=0)$("toast").textContent=""}}
function egg(e,x,y){cx.fillStyle=e.down?"#888":"#f0e2c2";cx.beginPath();cx.ellipse(x,y,17,22,0,0,Math.PI*2);cx.fill();cx.fillStyle="#111";cx.beginPath();cx.arc(x-5,y-3,2,0,7);cx.arc(x+5,y-3,2,0,7);cx.fill();cx.fillStyle="#fff";cx.font="10px sans-serif";cx.fillText(e.char,x-17,y-28)}
function bel(x,y){cx.fillStyle="#08090c";cx.beginPath();cx.ellipse(x,y-28,31,7,0,7);cx.fill();cx.fillRect(x-12,y-28,24,10);cx.fillStyle="#17131c";cx.beginPath();cx.moveTo(x-18,y-14);cx.lineTo(x+20,y-14);cx.lineTo(x+28,y+29);cx.lineTo(x-25,y+29);cx.closePath();cx.fill();cx.fillStyle="#2b2031";cx.fillRect(x-42,y-12,20,31);cx.strokeStyle="#8b52a6";cx.lineWidth=4;cx.beginPath();cx.moveTo(x+17,y-5);cx.lineTo(x+31,y+10);cx.stroke()}
function draw(){cx.clearRect(0,0,W,H);if(!running)return;let camx=clamp(player.x-W/2,0,Math.max(0,WORLD.w-W)),camy=clamp(player.y-H/2,0,Math.max(0,WORLD.h-H));cx.save();cx.translate(-camx,-camy);cx.fillStyle="#26322c";cx.fillRect(0,0,WORLD.w,WORLD.h);cx.fillStyle="#555e62";walls.forEach(q=>cx.fillRect(...q));for(const f of furn){cx.fillStyle=f.p>=100?"#45c887":"#ad6a30";cx.fillRect(f.x-22,f.y-22,44,44);cx.fillStyle="#fff";cx.font="11px sans-serif";cx.fillText(Math.floor(f.p)+"%",f.x-17,f.y+38)}cx.fillStyle="#354e5e";lockers.forEach(l=>cx.fillRect(l[0]-18,l[1]-28,36,56));cx.fillStyle="#a93257";pops.forEach(p=>cx.fillRect(p[0]-24,p[1]-32,48,64));for(const g of gates){cx.strokeStyle=g.o>=10?"#5df08e":"#e8c35a";cx.lineWidth=7;cx.strokeRect(g.x-55,g.y-18,110,36)}for(const e of ents){if(e.dead||(e.hide&&e!==player))continue;e.kind==="s"?egg(e,e.x,e.y):bel(e.x,e.y)}cx.restore();$("hud").innerHTML=(side==="s"?"逃生":"追捕")+"｜"+mode+"｜蒸汽炉 "+furn.filter(f=>f.p>=100).length+"/"+needed+"｜逃出 "+escaped+"<br>"+(player.kind==="s"?"HP "+player.hp+"/"+player.max+"｜"+player.char:"贝琳达｜能量 "+Math.floor(player.energy)+"%")}
function frame(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body></html>
